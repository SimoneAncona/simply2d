name: Build and smoke test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - name: Install Linux SDL2 development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev pkg-config
      - run: npm ci
      - run: npm test
      - name: Pack release
        run: npm pack --pack-destination ${{ runner.temp }}
      - name: Install packed release on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem "$env:RUNNER_TEMP/simply2d-*.tgz" | Select-Object -First 1
          $consumer = "$env:RUNNER_TEMP/package-consumer"
          New-Item $consumer -ItemType Directory -Force | Out-Null
          Set-Location $consumer
          npm init -y
          npm install $archive.FullName --omit=dev
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --input-type=module -e "import { Canvas } from 'simply2d'; const c = new Canvas('Package smoke test', 16, 16, 0, 0, {mode: 'hidden'}); c.close();"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

