name: Build and smoke test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - name: Install Linux SDL2 development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev pkg-config
      - name: Download Windows release libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libraries = @(
            @{ Repo = 'SDL'; Name = 'SDL2'; Version = '2.32.10'; Destination = 'sdl' },
            @{ Repo = 'SDL_image'; Name = 'SDL2_image'; Version = '2.8.12'; Destination = 'sdlimg' },
            @{ Repo = 'SDL_ttf'; Name = 'SDL2_ttf'; Version = '2.24.0'; Destination = 'sdlttf' }
          )
          foreach ($library in $libraries) {
            $archive = "$env:RUNNER_TEMP/$($library.Name).zip"
            $extracted = "$env:RUNNER_TEMP/$($library.Name)"
            $url = "https://github.com/libsdl-org/$($library.Repo)/releases/download/release-$($library.Version)/$($library.Name)-devel-$($library.Version)-VC.zip"
            Invoke-WebRequest $url -OutFile $archive
            Expand-Archive $archive -DestinationPath $extracted
            $destination = "bin/$($library.Destination)/winx64"
            New-Item $destination -ItemType Directory -Force | Out-Null
            Get-ChildItem $extracted -File -Recurse | Where-Object { $_.FullName -match '[\\/]lib[\\/]x64[\\/]' -and $_.Extension -in '.dll', '.lib' } | Copy-Item -Destination $destination
            Get-ChildItem $extracted -File -Recurse -Filter 'LICENSE*' | Copy-Item -Destination $destination
          }
      - run: npm ci
      - run: npm test
      - name: Pack release
        if: runner.os == 'Windows'
        run: npm pack --pack-destination ${{ runner.temp }}
      - name: Install packed release on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem "$env:RUNNER_TEMP/simply2d-*.tgz" | Select-Object -First 1
          $consumer = "$env:RUNNER_TEMP/package-consumer"
          New-Item $consumer -ItemType Directory -Force | Out-Null
          Set-Location $consumer
          npm init -y
          npm install $archive.FullName --omit=dev
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --input-type=module -e "import { Canvas } from 'simply2d'; const c = new Canvas('Package smoke test', 16, 16, 0, 0, {mode: 'hidden'}); c.close();"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
