name: Build and smoke test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - name: Install Linux SDL2 development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev pkg-config
      - name: Download Windows release libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $libraries = @(
            @{ Repo = 'SDL'; Name = 'SDL2'; Version = '2.32.10'; Destination = 'sdl' },
            @{ Repo = 'SDL_image'; Name = 'SDL2_image'; Version = '2.8.12'; Destination = 'sdlimg' },
            @{ Repo = 'SDL_ttf'; Name = 'SDL2_ttf'; Version = '2.24.0'; Destination = 'sdlttf' },
            @{ Repo = 'SDL_mixer'; Name = 'SDL2_mixer'; Version = '2.8.2'; Destination = 'sdlmixer' }
          )
          foreach ($library in $libraries) {
            $archive = "$env:RUNNER_TEMP/$($library.Name).zip"
            $extracted = "$env:RUNNER_TEMP/$($library.Name)"
            $url = "https://github.com/libsdl-org/$($library.Repo)/releases/download/release-$($library.Version)/$($library.Name)-devel-$($library.Version)-VC.zip"
            curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 180 --output $archive $url
            if ($LASTEXITCODE) { throw "Download failed: $url" }
            Expand-Archive $archive -DestinationPath $extracted
            $destination = "bin/$($library.Destination)/winx64"
            New-Item $destination -ItemType Directory -Force | Out-Null
            Get-ChildItem $extracted -File -Recurse | Where-Object { $_.FullName -match '[\\/]lib[\\/]x64[\\/]' -and $_.Extension -in '.dll', '.lib' } | Copy-Item -Destination $destination
            Get-ChildItem $extracted -File -Recurse -Filter 'LICENSE*' | Copy-Item -Destination $destination
          }
      - run: npm ci
      - run: npm test
      - name: Audio example smoke test
        run: node examples/audio.js --smoke
      - name: Pack release
        if: runner.os == 'Windows'
        run: npm pack --pack-destination ${{ runner.temp }}
      - name: Install packed release on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem "$env:RUNNER_TEMP/simply2d-*.tgz" | Select-Object -First 1
          $consumer = "$env:RUNNER_TEMP/package-consumer"
          New-Item $consumer -ItemType Directory -Force | Out-Null
          Set-Location $consumer
          npm init -y
          npm install $archive.FullName --omit=dev
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:SDL_AUDIODRIVER = "dummy"
          $smoke = @'
          import { Audio, Canvas, rectanglesOverlap } from 'simply2d';
          import { join } from 'node:path';
          const c = new Canvas('Package smoke test', 16, 16, 0, 0, {mode: 'hidden'});
          const a = new Audio();
          c.close();
          for (const format of ['mp3', 'ogg', 'flac']) {
            const path = join(process.env.GITHUB_WORKSPACE, 'test', 'assets', 'tone.' + format);
            a.loadSound(format, path);
            a.play(format);
            a.loadMusic(format, path);
            const track = a.playMusic(format, {loop: true});
            if (track.state !== 'playing') throw new Error(format + ' music did not start');
          }
          if (!rectanglesOverlap({x:0,y:0,width:2,height:2}, {x:1,y:1,width:2,height:2})) throw new Error('Collision exports missing');
          a.stopAll(); a.close();
          '@
          node --input-type=module -e $smoke
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
